<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program Team: Goals, Plan and Review - Local Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #E4EAF3;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .preview-banner {
      background: #1E293B;
      color: #F8FAFC;
      padding: 8px 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-banner a {
      color: #60A5FA;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="preview-banner">
    <div><strong>Program Team: Goals, Plan and Review</strong> &middot; Local Sandbox Preview</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="color:#94A3B8; font-size:11px;">RBAC Simulator:</span>
      <select id="previewRoleSelect" onchange="simulateRole(this.value)" style="background:#0F172A; color:#F8FAFC; border:1px solid #334155; border-radius:6px; padding:3px 8px; font-size:12px; cursor:pointer;">
        <option value="user" selected>👤 Regular Staff (Strictly View-Only)</option>
        <option value="admin">👑 IT Admin (Can edit ALL plans)</option>
        <option value="bharat">👤 Bharat (PM - Can edit Bharat's plans)</option>
        <option value="shubham">👤 Shubham (PM - Can edit Shubham's plans)</option>
        <option value="vishvajit">👤 Vishvajit Pawar (View-Only by default)</option>
      </select>
      <button id="previewThemeBtn" onclick="togglePreviewTheme()" style="background:#0F172A; color:#38BDF8; border:1px solid #334155; border-radius:6px; padding:3px 10px; font-size:12px; font-weight:600; cursor:pointer;">🌙 Dark Mode</button>
      <a href="index.html">&larr; Open Full StaffConnect App</a>
    </div>
  </div>
  <div id="pageContent"></div>

  <script src="olf-select.js?v=20261106s"></script>
  <script src="historical-data.js?v=20261106a"></script>
  <script src="historical-internal-data.js?v=20261106a"></script>
  <script src="historical-module.js?v=20261106e"></script>
  <script src="weekly-ops-data.js?v=20261106f"></script>
  <script src="weekly-ops-module.js?v=20261106s"></script>
  <script src="progress-data.js?v=20261112g"></script>
  <script src="progress-module.js?v=20261112g"></script>
  <script src="team-performance-data.js?v=20261106a"></script>
  <script src="team-performance.js?v=20261112g"></script>
  <script>
    function simulateRole(val) {
      if (val === 'admin') {
        window.__olfUser = { email: 'admin@openlinksfoundation.org', displayName: 'IT Admin', role: 'Admin' };
      } else if (val === 'bharat') {
        window.__olfUser = { email: 'bharat@openlinksfoundation.org', displayName: 'Bharat', role: 'User' };
      } else if (val === 'shubham') {
        window.__olfUser = { email: 'shubham@openlinksfoundation.org', displayName: 'Shubham', role: 'User' };
      } else if (val === 'vishvajit') {
        window.__olfUser = { email: 'vishvajit@openlinksfoundation.org', displayName: 'Vishvajit Pawar', role: 'User' };
      } else {
        window.__olfUser = { email: 'user@openlinksfoundation.org', displayName: 'Regular Staff', role: 'User' };
      }
      localStorage.setItem('olf_smart_goals_simulated_user', JSON.stringify(window.__olfUser));
      if (window.TeamPerformance && typeof window.TeamPerformance.checkPermissions === 'function') {
        window.TeamPerformance.checkPermissions();
      }
      if (window.HistoricalModule && typeof window.HistoricalModule.init === 'function') {
        window.HistoricalModule.init();
      }
      if (window.WeeklyOpsModule && typeof window.WeeklyOpsModule.init === 'function') {
        window.WeeklyOpsModule.init();
      }
    }

    function togglePreviewTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nextTheme);
      document.body.style.background = isDark ? '#E4EAF3' : '#0B1120';
      const btn = document.getElementById('previewThemeBtn');
      if (btn) btn.textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
      if (window.TeamPerformance && typeof window.TeamPerformance.drawConnectors === 'function') {
        window.TeamPerformance.drawConnectors();
      }
    }

    // Default simulation = Regular User (View-Only)
    simulateRole('user');

    fetch('pages/team-performance.html?v=20261112g')
      .then(res => res.text())
      .then(html => {
        document.getElementById('pageContent').innerHTML = html;
        if (window.TeamPerformance && typeof window.TeamPerformance.mount === 'function') {
          window.TeamPerformance.mount();
          const qView = new URLSearchParams(window.location.search).get('view');
          if (qView && typeof window.TeamPerformance.switchView === 'function') {
            window.TeamPerformance.switchView(qView);
          }
        }
      });
  </script>
</body>
</html>
