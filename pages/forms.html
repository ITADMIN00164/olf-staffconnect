<!-- =====================================================================
     OLF Staff Connect - OLF Forms
     Lives at pages/forms.html: navigate() in app.js fetches page fragments
     from `pages/${page}.html` and injects them into #pageContent.
     ===================================================================== -->

<!-- No class="page" here on purpose: index.html sets .page{display:none}
     and only .page.active is shown. navigate() replaces #pageContent
     instead of toggling .active, so this section must stay unclassed. -->
<section id="page-forms">

  <header class="frm-head">
    <div class="frm-head__text">
      <h1>OLF Forms</h1>
      <p>Forms sent to you, and everything you have recorded so far.</p>
    </div>
    <div class="frm-head__side">
      <span class="frm-hint" id="frmStatus"></span>
      <button class="frm-btn" onclick="frmBootstrap(true)">Refresh</button>
    </div>
  </header>

  <!-- The veil sits outside #frmShell so it stays sharp while the content
       behind it blurs. -->
  <div class="frm-shell" id="frmShell">
    <div id="frmRoot">
      <div class="frm-blank">Loading your forms&hellip;</div>
    </div>
  </div>

  <div class="frm-veil" id="frmVeil" hidden aria-live="polite" aria-busy="false">
    <div class="frm-veil__box">
      <span class="frm-spin" aria-hidden="true"></span>
      <span class="frm-veil__text">Working&hellip;</span>
    </div>
  </div>

  <div class="frm-modal" id="frmModal" hidden></div>

  <div class="frm-toasts" id="frmToasts"></div>

</section>

<style>
/* Everything is scoped under #page-forms so no rule can leak into the
   other modules that share this shell. */
#page-forms {
  --ink:    #14203a;   /* headings and body */
  --soft:   #63708a;   /* secondary text */
  --rule:   #dfe5ee;   /* hairlines and field borders */
  --paper:  #ffffff;
  --wash:   #f5f8fc;   /* quiet panel fill */
  --accent: #2563c9;
  --accent-deep: #1a49a0;
  --go:     #0e7a52;   /* published / done */
  --wait:   #a35a06;   /* draft */
  --stop:   #b02a1e;   /* errors, archived */

  color: var(--ink);
  font-variant-numeric: tabular-nums;   /* a ledger: keep figures aligned */
  position: relative;
}

/* ---------------------------------------------------------------- header */
#page-forms .frm-head { display:flex; flex-wrap:wrap; gap:14px;
  align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
#page-forms .frm-head h1 { font-size:23px; line-height:1.15; margin:0 0 5px;
  font-weight:640; letter-spacing:-0.011em; }
#page-forms .frm-head p { margin:0; color:var(--soft); font-size:13.5px;
  max-width:62ch; }
#page-forms .frm-head__side { display:flex; align-items:center; gap:10px; }

/* ------------------------------------------------------------------ tabs */
#page-forms .frm-tabs { display:flex; gap:2px; border-bottom:1px solid var(--rule);
  margin-bottom:22px; }
#page-forms .frm-tab { appearance:none; background:none; border:0;
  border-bottom:2px solid transparent; margin-bottom:-1px;
  padding:9px 14px; font:inherit; font-size:14px; color:var(--soft);
  cursor:pointer; }
#page-forms .frm-tab:hover { color:var(--ink); }
#page-forms .frm-tab.is-on { color:var(--accent); border-bottom-color:var(--accent);
  font-weight:600; }

/* --------------------------------------------------------------- buttons */
#page-forms .frm-btn { appearance:none; background:var(--paper);
  border:1px solid var(--rule); border-radius:7px; padding:8px 14px;
  font:inherit; font-size:13px; line-height:1.25; color:var(--ink);
  cursor:pointer; transition:background .12s ease, border-color .12s ease; }
#page-forms .frm-btn:hover { background:var(--wash); border-color:#c9d3e2; }
#page-forms .frm-btn:active { transform:translateY(1px); }
#page-forms .frm-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
#page-forms .frm-btn--key { background:var(--accent); border-color:var(--accent);
  color:#fff; font-weight:550; }
#page-forms .frm-btn--key:hover { background:var(--accent-deep);
  border-color:var(--accent-deep); }
#page-forms .frm-btn--tiny { padding:5px 9px; font-size:12px; border-radius:6px; }
#page-forms .frm-btn--warn { color:var(--stop); border-color:#eec7c2; }
#page-forms .frm-btn--warn:hover { background:#fdf3f2; border-color:#e0a9a1; }
#page-forms .frm-btn--danger { background:var(--stop); border-color:var(--stop);
  color:#fff; font-weight:550; }
#page-forms .frm-btn--danger:hover { background:#8f2118; border-color:#8f2118; }
#page-forms .frm-back { appearance:none; display:inline-flex; align-items:center;
  gap:7px; background:var(--paper); border:1px solid var(--rule);
  border-radius:7px; padding:7px 13px 7px 11px; margin-bottom:16px;
  font:inherit; font-size:13px; font-weight:550; color:var(--ink);
  cursor:pointer; transition:background .12s ease, border-color .12s ease; }
#page-forms .frm-back::before { content:'\2190'; font-size:14px;
  color:var(--accent); }
#page-forms .frm-back:hover { background:var(--wash); border-color:#c9d3e2; }
#page-forms .frm-back:active { transform:translateY(1px); }
#page-forms .frm-rowacts { display:flex; flex-wrap:wrap; gap:5px; }

#page-forms :focus-visible { outline:2px solid var(--accent); outline-offset:2px;
  border-radius:4px; }

/* ------------------------------------------------------------- headings */
#page-forms .frm-h2 { font-size:14px; font-weight:620; margin:26px 0 10px;
  letter-spacing:-0.005em; }
#page-forms #frmBody > .frm-h2:first-child { margin-top:0; }
#page-forms .frm-page__title { font-size:21px; font-weight:640; margin:0 0 6px;
  letter-spacing:-0.011em; }
#page-forms .frm-page__lede { margin:0 0 20px; color:var(--soft); font-size:13.5px;
  max-width:70ch; }
#page-forms .frm-page { max-width:820px; }

/* ------------------------------------------------- figures (summary bar) */
/* One inline bar with hairline dividers, not four identical cards. */
#page-forms .frm-figures { display:flex; flex-wrap:wrap;
  border:1px solid var(--rule); border-radius:10px; background:var(--paper);
  padding:2px 0; margin-bottom:24px; }
#page-forms .frm-figure { flex:1 1 96px; padding:12px 18px;
  border-left:1px solid var(--rule); }
#page-forms .frm-figure:first-child { border-left:0; }
#page-forms .frm-figure__n { display:block; font-size:25px; font-weight:640;
  line-height:1.05; letter-spacing:-0.02em; }
#page-forms .frm-figure__l { display:block; font-size:12px; color:var(--soft);
  margin-top:3px; }

/* ----------------------------------------------------------- form items */
#page-forms .frm-items { list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:10px; }
#page-forms .frm-item { display:flex; gap:16px; align-items:center;
  background:var(--paper); border:1px solid var(--rule); border-radius:10px;
  padding:15px 17px; position:relative; overflow:hidden; }
/* The status rail: carries state, so it is information rather than trim. */
#page-forms .frm-item::before { content:''; position:absolute; inset:0 auto 0 0;
  width:3px; background:var(--accent); }
#page-forms .frm-item[data-done="true"]::before { background:var(--go); }
#page-forms .frm-item__body { flex:1 1 auto; min-width:0; }
#page-forms .frm-item__title { margin:0; font-size:15.5px; font-weight:600; }
#page-forms .frm-item__desc { margin:4px 0 0; color:var(--soft); font-size:13px; }
#page-forms .frm-item__meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
#page-forms .frm-meta { font-size:11.5px; color:var(--soft);
  background:var(--wash); border-radius:5px; padding:3px 8px; }
#page-forms .frm-meta b { font-weight:640; color:var(--ink); }
#page-forms .frm-meta--done { background:#e6f3ec; color:var(--go); }
#page-forms .frm-meta--done b { color:var(--go); }

/* ----------------------------------------------------------------- grids */
#page-forms .frm-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch;
  border:1px solid var(--rule); border-radius:10px; background:var(--paper); }
#page-forms .frm-grid { width:100%; border-collapse:collapse; font-size:13px; }
#page-forms .frm-grid th, #page-forms .frm-grid td { text-align:left;
  padding:10px 12px; border-bottom:1px solid var(--rule); vertical-align:top; }
#page-forms .frm-grid thead th { background:var(--wash); font-weight:600;
  font-size:12px; color:var(--soft); white-space:nowrap; }
#page-forms .frm-grid tbody tr:last-child td { border-bottom:0; }
#page-forms .frm-grid tbody tr:hover td { background:#fafcfe; }
#page-forms .frm-grid__name { font-weight:550; }
#page-forms .frm-grid__rail { width:3px; padding:0; background:var(--rule); }
#page-forms .frm-grid__rail[data-state="published"] { background:var(--go); }
#page-forms .frm-grid__rail[data-state="draft"] { background:var(--wait); }
#page-forms .frm-grid__rail[data-state="closed"] { background:#9aa7bd; }
#page-forms .frm-grid__rail[data-state="archived"] { background:var(--stop); }
#page-forms .frm-num { text-align:right; }
#page-forms .frm-soft { color:var(--soft); }
#page-forms .frm-ref { display:block; font-size:11px; color:var(--soft);
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#page-forms .frm-tally { margin:9px 0 0; font-size:12px; color:var(--soft); }
#page-forms .frm-page--wide { max-width:1100px; }

/* A form name on the dashboard is the way into its detail. */
#page-forms .frm-open { appearance:none; background:none; border:0; padding:0;
  font:inherit; font-weight:600; color:var(--ink); text-align:left;
  cursor:pointer; border-bottom:1px solid transparent; }
#page-forms .frm-open:hover { color:var(--accent);
  border-bottom-color:var(--accent); }
/* Secondary ways into the same detail: readable as links, not as headings. */
#page-forms .frm-open--soft { font-weight:550; color:var(--accent);
  border-bottom-color:rgba(37,99,201,.3); font-variant-numeric:tabular-nums; }
#page-forms .frm-open--soft:hover { border-bottom-color:var(--accent); }

/* Detail: recipients, their counts, and the entries behind each count. */
#page-forms .frm-grid--detail tbody tr.frm-drow > td { border-bottom:0; }
#page-forms .frm-grid--detail tbody tr.frm-drow.is-quiet .frm-grid__name {
  font-weight:500; color:var(--soft); }
#page-forms .frm-grid--detail tbody tr.frm-drow + tr.frm-drow > td {
  border-top:1px solid var(--rule); }
#page-forms .frm-grid--detail tbody tr.frm-dsub + tr.frm-drow > td {
  border-top:1px solid var(--rule); }
#page-forms .frm-tally-btn { appearance:none; min-width:34px; padding:3px 9px;
  font:inherit; font-size:13px; font-weight:640; font-variant-numeric:tabular-nums;
  color:var(--accent); background:#eaf1fd; border:1px solid #cfe0f8;
  border-radius:6px; cursor:pointer;
  transition:background .12s ease, color .12s ease; }
#page-forms .frm-tally-btn:hover { background:#d9e7fb; }
#page-forms .frm-tally-btn.is-on { background:var(--accent);
  border-color:var(--accent); color:#fff; }
#page-forms .frm-dsub > td { padding:0 12px 12px 12px; background:var(--wash); }
#page-forms .frm-subgrid { width:100%; border-collapse:collapse;
  font-size:12.5px; background:var(--paper); border:1px solid var(--rule);
  border-radius:8px; overflow:hidden; }
#page-forms .frm-subgrid th, #page-forms .frm-subgrid td {
  text-align:left; padding:8px 11px; border-bottom:1px solid var(--rule); }
#page-forms .frm-subgrid thead th { background:#eef2f8; font-weight:600;
  font-size:11.5px; color:var(--soft); white-space:nowrap; }
#page-forms .frm-subgrid tbody tr:last-child td { border-bottom:0; }
#page-forms .frm-subgrid .frm-ref { display:inline; }
#page-forms .frm-subgrid .frm-grid__name .frm-ref { display:block; }

#page-forms .frm-tag { display:inline-block; font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:11px; text-transform:capitalize;
  background:var(--wash); color:var(--soft); }
#page-forms .frm-tag[data-state="published"] { background:#e6f3ec; color:var(--go); }
#page-forms .frm-tag[data-state="draft"] { background:#fdf1e3; color:var(--wait); }
#page-forms .frm-tag[data-state="archived"] { background:#f8e9e7; color:var(--stop); }

/* ------------------------------------------------------ bars and notices */
#page-forms .frm-bar { display:flex; flex-wrap:wrap; align-items:center; gap:9px;
  margin-bottom:18px; }
#page-forms .frm-bar__note { margin:0; font-size:12px; color:var(--soft);
  flex:1 1 220px; }
#page-forms .frm-blank { border:1px dashed #cfd8e6; border-radius:10px;
  padding:30px 20px; text-align:center; color:var(--soft); font-size:13.5px; }
#page-forms .frm-blank--tight { padding:18px; }
#page-forms .frm-blank--bad { border-color:#eec7c2; color:var(--stop); }
#page-forms .frm-blank__head { margin:0 0 5px; font-size:15px; font-weight:600;
  color:var(--ink); }
#page-forms .frm-blank--bad .frm-blank__head { color:var(--stop); }
#page-forms .frm-blank__body { margin:0 0 14px; }
#page-forms .frm-blank__body:last-child { margin-bottom:0; }
#page-forms .frm-note { background:var(--wash); border:1px solid var(--rule);
  border-radius:8px; padding:11px 13px; font-size:13px; color:var(--soft);
  margin:0 0 14px; }
#page-forms .frm-note--bad { background:#fdf3f2; border-color:#eec7c2;
  color:var(--stop); }
#page-forms .frm-hint { font-size:12px; color:var(--soft); }

/* ---------------------------------------------------------------- sheets */
#page-forms .frm-sheet { background:var(--paper); border:1px solid var(--rule);
  border-radius:10px; padding:18px; margin-bottom:14px; }
#page-forms .frm-sheet--quiet { background:var(--wash); }
#page-forms .frm-sheet__head { display:flex; align-items:center; gap:9px;
  font-size:14px; font-weight:620; margin:0 0 14px; }
#page-forms .frm-sheet__foot { margin:12px 0 0; font-size:12px; color:var(--soft); }
#page-forms .frm-count { font-size:11.5px; font-weight:600; color:var(--soft);
  background:var(--paper); border:1px solid var(--rule); border-radius:9px;
  padding:1px 7px; }
#page-forms .frm-sheet--quiet .frm-count { background:var(--paper); }

/* ---------------------------------------------------------------- fields */
#page-forms .frm-field { margin-bottom:14px; }
#page-forms .frm-field:last-child { margin-bottom:0; }
#page-forms .frm-field > label { display:block; font-size:12.5px; font-weight:600;
  color:var(--soft); margin-bottom:5px; }
#page-forms .frm-field__note { margin:10px 0 0; font-size:12px; color:var(--soft); }
#page-forms .frm-pair { display:flex; flex-wrap:wrap; gap:14px; }
#page-forms .frm-pair > .frm-field { flex:1 1 190px; min-width:0; }
#page-forms .frm-field--narrow { flex:0 0 110px; }
#page-forms .frm-field--mid { display:flex; align-items:flex-end; padding-bottom:9px; }
#page-forms .frm-input { width:100%; box-sizing:border-box; font:inherit;
  font-size:14px; color:var(--ink); background:var(--paper);
  border:1px solid #cfd8e6; border-radius:7px; padding:9px 11px;
  transition:border-color .12s ease, box-shadow .12s ease; }
#page-forms .frm-input:hover { border-color:#b6c3d6; }
#page-forms .frm-input:focus { outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(37,99,201,.14); }
#page-forms .frm-input:disabled { background:var(--wash); color:var(--soft); }
#page-forms .frm-input--auto { width:auto; min-width:200px; max-width:100%; }
#page-forms textarea.frm-input { resize:vertical; line-height:1.5; }
#page-forms .frm-star { color:var(--stop); margin-left:3px; }

/* --------------------------------------------------------------- options */
#page-forms .frm-opts { display:flex; flex-direction:column; gap:2px; }
#page-forms .frm-opts--row { flex-direction:row; flex-wrap:wrap; gap:8px; }
#page-forms .frm-opt > span { white-space:pre-wrap; }
#page-forms .frm-opt { display:flex; align-items:flex-start; gap:9px;
  font-size:14px; padding:8px 11px; border:1px solid transparent;
  border-radius:7px; cursor:pointer; transition:background .12s ease; }
#page-forms .frm-opt:hover { background:var(--wash); }
#page-forms .frm-opt input { width:17px; height:17px; flex:0 0 auto; margin:1px 0 0;
  accent-color:var(--accent); }
#page-forms .frm-opt--wide { border-color:var(--rule); margin-bottom:8px; }
#page-forms .frm-opt--wide b { display:block; font-weight:600; font-size:14px; }
#page-forms .frm-opt--wide em { display:block; font-style:normal; font-size:12.5px;
  color:var(--soft); margin-top:2px; line-height:1.45; }
#page-forms .frm-opts--row .frm-opt { border-color:var(--rule); }

/* --------------------------------------------------------- questions (fill) */
#page-forms .frm-qs { display:flex; flex-direction:column; gap:20px; }
#page-forms .frm-q__label { display:flex; gap:9px; align-items:baseline;
  font-size:14.5px; font-weight:550; margin-bottom:7px; }
#page-forms .frm-q__n { flex:0 0 auto; min-width:20px; height:20px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:640; color:var(--accent);
  background:#eaf1fd; border-radius:5px; }
#page-forms .frm-q__help { margin:0 0 7px 29px; font-size:12.5px; color:var(--soft); }
#page-forms .frm-q .frm-input, #page-forms .frm-q .frm-opts { margin-left:29px;
  width:calc(100% - 29px); }
/* An unanswered required question marks itself, so the message can stay
   short instead of listing every title. */
#page-forms .frm-q.is-missing { border-left:3px solid var(--stop);
  padding-left:12px; margin-left:-15px; }
#page-forms .frm-q.is-missing .frm-q__label { color:var(--stop); }
#page-forms .frm-q.is-missing .frm-q__n { background:#fbe9e7;
  color:var(--stop); }
#page-forms .frm-q.is-missing .frm-input { border-color:#e0a9a1; }
#page-forms .frm-q__need { margin:6px 0 0 29px; font-size:12px;
  font-weight:600; color:var(--stop); }

#page-forms .frm-key { background:var(--wash); border:1px solid var(--rule);
  border-radius:8px; padding:13px; margin-bottom:20px; }
#page-forms .frm-key__label { display:block; font-size:13px; font-weight:600;
  margin-bottom:7px; }
#page-forms .frm-key__note { margin:7px 0 0; font-size:12px; color:var(--soft); }
#page-forms .frm-warnnote { display:block; margin-top:4px; color:var(--wait);
  font-weight:550; }

/* ---------------------------------------------------- recorded entries */
#page-forms .frm-entries { list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:1px; }
#page-forms .frm-entry { display:flex; align-items:center; gap:12px;
  background:var(--paper); border:1px solid var(--rule); border-radius:7px;
  padding:9px 12px; }
#page-forms .frm-entry.is-on { border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(37,99,201,.12); }
#page-forms .frm-entry__key { font-weight:600; font-size:13.5px; flex:1 1 auto;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#page-forms .frm-entry__when { font-size:11.5px; color:var(--soft);
  flex:0 0 auto; }
#page-forms .frm-done { display:flex; flex-wrap:wrap; align-items:center;
  gap:12px; background:#e9f4ee; border:1px solid #bfe0cd; border-radius:9px;
  padding:12px 15px; margin-bottom:16px; font-size:13.5px; font-weight:550;
  color:var(--go); }
#page-forms .frm-done .frm-ref { display:inline; color:var(--go); opacity:.75; }
#page-forms .frm-done__score { margin-left:auto; }
#page-forms .frm-answers { margin:0; }
#page-forms .frm-answers dt { font-size:12.5px; font-weight:600;
  color:var(--soft); margin-top:14px; }
#page-forms .frm-answers dt:first-child { margin-top:0; }
#page-forms .frm-answers dd { margin:4px 0 0; font-size:14px;
  padding-bottom:12px; border-bottom:1px solid var(--rule); }
#page-forms .frm-answers dd:last-child { border-bottom:0; padding-bottom:0; }

#page-forms .frm-addbar { display:flex; flex-wrap:wrap; align-items:center;
  gap:12px; margin-top:14px; padding-top:14px;
  border-top:1px solid var(--rule); }

/* ---------------------------------------------------------------- picker */
#page-forms .frm-picker { border-top:1px solid var(--rule); margin-top:13px;
  padding-top:14px; }
#page-forms .frm-picker__top { display:flex; align-items:center; gap:11px;
  margin-bottom:11px; }
#page-forms .frm-picker__top .frm-input { flex:1 1 auto; }
#page-forms .frm-picker__n { font-size:12px; color:var(--soft); white-space:nowrap; }
#page-forms .frm-picker__n.is-on { color:var(--accent); font-weight:640; }
#page-forms .frm-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:11px; }
#page-forms .frm-chip { appearance:none; font:inherit; font-size:12px;
  background:var(--paper); border:1px solid var(--rule); border-radius:14px;
  padding:4px 12px; color:var(--ink); cursor:pointer;
  transition:background .12s ease, color .12s ease, border-color .12s ease; }
#page-forms .frm-chip:hover { background:var(--wash); }
#page-forms .frm-chip.is-on { background:var(--accent); border-color:var(--accent);
  color:#fff; font-weight:550; }
#page-forms .frm-picker__acts { display:flex; flex-wrap:wrap; align-items:center;
  gap:6px; margin-bottom:10px; }
/* Segmented switch: which staff the list is showing. */
#page-forms .frm-pickview { display:inline-flex; margin-right:auto;
  border:1px solid var(--rule); border-radius:7px; overflow:hidden;
  background:var(--paper); }
#page-forms .frm-pv { appearance:none; background:none; border:0;
