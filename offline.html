<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2F6FE4">
<title>Offline - OLF Staff Connect</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #E0E8F6, #DDEFEA); color: #1B2A3B;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center; padding: 34px 26px 28px; border-radius: 24px;
    background: rgba(255,255,255,.85); box-shadow: 0 18px 50px rgba(15,23,42,.14);
  }
  .ico {
    width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center;
    background: linear-gradient(135deg, #4F8EF7, #0B8F7A); box-shadow: 0 10px 24px rgba(47,111,228,.35);
  }
  .ico svg { width: 38px; height: 38px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.4px; }
  p { margin: 0 0 22px; font-size: 15px; line-height: 1.55; color: #55657A; }
  button {
    width: 100%; min-height: 48px; border: 0; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 700;
    color: #fff; cursor: pointer; background: linear-gradient(135deg, #2F6FE4, #0B8F7A);
  }
  button:active { transform: scale(.98); }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(135deg, #10192B, #0E2A2B); color: #E7EEF8; }
    .card { background: rgba(28,38,58,.9); }
    p { color: #A9B8CC; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.2a5 5 0 0 1 7 0"/><circle cx="12" cy="19.6" r="1"/><path d="M3 3l18 18"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>OLF Staff Connect needs an internet connection to show the latest data. Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
